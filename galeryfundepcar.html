<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="global-styles.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="responsive.css" />
  <title>Salud hoy</title>
  
  <style>
    /* Estilos generales CORREGIDOS */

    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
    }

    /* Galería estilo Pinterest - VERSIÓN ORIGINAL CORREGIDA */
    .gallery {
      column-count: 4;
      column-gap: 15px;
      max-width: 1200px;
      width: 100%; /* Aseguramos que ocupe el ancho máximo disponible */
      margin: 0 auto; /* Centrado horizontal */
    }

    .gallery img {
      width: 100%;
      margin-bottom: 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
      break-inside: avoid;
      display: block; /* Corrige espacios fantasma */
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      align-items: center;
      justify-content: center;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    /* Responsividad */
    @media (max-width: 768px) {
      .gallery {
        column-count: 2;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        column-count: 1;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar" id="navbar">
    <a class="logo" href="index.html"><img src="/images/logo.png" alt="" /></a>
    <ul class="enlaces" id="enlaces">
      <li class="enlace"><a href="index.html">Home</a></li>
      <li class="enlace"><a href="ministries.html">Ministries</a></li>
    </ul>

    <a class="boton btn-donaciones" href="donation.html">Donate</a>

    <!-- <a
      class="boton btn-donaciones"
      href="https://buy.stripe.com/eVacNFeLnb7saEo3cc"
      >Donate</a
    > -->

    <div class="menu" id="menu">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </nav>
  <h1>Pesca Milagrosa</h1>

  <div class="gallery">
    <img src="images/galeryfundepcar/fudepcar1.jpg" alt="Imagen 1">
    <img src="images/galeryfundepcar/fudepcar2.jpg" alt="Imagen 2">
    <img src="images/galeryfundepcar/fudepcar3.jpg" alt="Imagen 3">
    <img src="images/galeryfundepcar/fudepcar4.jpg" alt="Imagen 4">
    <img src="images/galeryfundepcar/fudepcar5.jpg" alt="Imagen 5">
    <img src="images/galeryfundepcar/fudepcar6.jpg" alt="Imagen 6">

  </div>

  <div class="modal" id="modal">
    <img id="modal-img" src="" alt="Imagen ampliada">
  </div>

  <script src="menu-responsive.js"></script>

  <script>
    // JavaScript original
    const images = document.querySelectorAll('.gallery img');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');

    images.forEach(img => {
      img.addEventListener('click', () => {
        modal.style.display = 'flex';
        modalImg.src = img.src;
      });
    });

    modal.addEventListener('click', (e) => {
      if (e.target !== modalImg) {
        modal.style.display = 'none';
      }
    });
  </script>
</body>
</html>
